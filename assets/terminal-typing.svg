<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 138" fill="none" role="img" aria-labelledby="term-title">
  <title id="term-title">terminal: waldy@github — building intelligent systems</title>
  <desc>Animated terminal window typing the profile headline.</desc>
  <defs>
    <linearGradient id="term-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <clipPath id="term-line-0"><rect x="-4" y="60" width="0" height="28"><animate attributeName="width" from="0" to="640" dur="0.55s" begin="0.7s" fill="freeze"/></rect></clipPath>
    <clipPath id="term-line-1"><rect x="-4" y="94" width="0" height="28"><animate attributeName="width" from="0" to="560" dur="0.55s" begin="1.7s" fill="freeze"/></rect></clipPath>
    <clipPath id="term-line-2"><rect x="-4" y="108" width="0" height="28"><animate attributeName="width" from="0" to="520" dur="0.55s" begin="2.7s" fill="freeze"/></rect></clipPath>
  </defs>
  <rect width="900" height="138" rx="16" fill="url(#term-bg)"/>
  <rect x="0.5" y="0.5" width="899" height="137" rx="16" stroke="#1E293B" stroke-width="1" opacity="0.8">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="4s" repeatCount="indefinite"/>
  </rect>
  <circle cx="24" cy="26" r="6" fill="#FB7185"/>
  <circle cx="48" cy="26" r="6" fill="#FBBF24"/>
  <circle cx="72" cy="26" r="6" fill="#34D399"/>
  <text x="92" y="31" font-family="Consolas, Menlo, monospace" font-size="14" fill="#64748B">waldy@github: ~</text>
  <text x="24" y="64" font-family="Consolas, Menlo, monospace" font-size="18" fill="#2DD4BF">$</text>
  <text x="44" y="64" font-family="Consolas, Menlo, monospace" font-size="18" fill="#E2E8F0">whoami</text>
  <g clip-path="url(#term-line-0)">
    <text x="44" y="96" font-family="Consolas, Menlo, monospace" font-size="18" fill="#38BDF8">Machine Learning &amp; AI Engineer — Universitas Teknologi Yogyakarta</text>
  </g>
  <g clip-path="url(#term-line-1)">
    <text x="24" y="124" font-family="Consolas, Menlo, monospace" font-size="18" fill="#2DD4BF">&gt;</text>
    <text x="44" y="124" font-family="Consolas, Menlo, monospace" font-size="18" fill="#E2E8F0">building intelligent systems that run in production</text>
  </g>
  <rect x="588" y="104" width="9" height="20" fill="#2DD4BF" opacity="0">
    <animate attributeName="opacity" values="0;0;1;0;1;0" keyTimes="0;0.25;0.32;0.5;0.68;1" dur="1.6s" begin="3.2s" repeatCount="indefinite"/>
  </rect>
</svg>